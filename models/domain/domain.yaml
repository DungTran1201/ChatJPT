version: '1.0'
entities:
- name: User
  aggregate_root: true
  attributes:
  - id: UUID (PK)
  - email: string (UNIQUE, RFC 5322)
  - full_name: string
  - hashed_password: string (bcrypt)
  - username: string (UNIQUE, Slug)
  - avatar_url: string (HTTPS URL)
  - bio: string (max 500)
  - phone_number: string
  - age: integer (1..120, nullable)
  - occupation: string (max 100, nullable)
  - interests: string (max 255, nullable)
  - japanese_level: enum(CHUA_HOC, N5, N4, N3, N2, N1)
  - learning_goal: string (max 255, nullable)
  - custom_bg_url: string (max 1000, nullable)
  - bg_opacity: integer (20..100, default 90)
  - bg_blur: integer (0..40, default 12)
  - bg_dim: integer (0..100, default 0)
  - accent_color: string (max 30, preset or hex code)
  - ui_font_size: enum(small, medium, large)
  - theme_preference: enum(DARK, LIGHT, SYSTEM)
  - language_preference: enum(vi, en, ja)
  - response_show_translation: boolean (default true)
  - response_show_furigana: boolean (default true)
  - response_highlight_grammar: boolean (default true)
  - response_show_romaji: boolean (default true)
  - response_grammar_breakdown: boolean (default true)
  - response_audio_speech: boolean (default true)
  - response_bilingual_mode: enum(interlinear, parallel, japanese_only)
  - status: enum(ACTIVE, DISABLED)
  - last_login_at: timestamp
  - password_changed_at: timestamp
  - created_at: timestamp
  - updated_at: timestamp
- name: Conversation
  aggregate_root: true
  attributes:
  - id: UUID (PK)
  - user_id: UUID (FK -> User.id)
  - title: string
  - created_at: timestamp
  - updated_at: timestamp
- name: Message
  aggregate_root: false
  attributes:
  - id: UUID (PK)
  - conversation_id: UUID (FK -> Conversation.id)
  - role: enum(USER, ASSISTANT)
  - content: string
  - model_used: string (FK -> AgentModel.id)
  - tokens_prompt: integer
  - tokens_completion: integer
  - source: enum(WEB, DISCORD)
  - status: enum(PENDING, STREAMING, COMPLETED, ERROR, ABORTED, FAILED)
  - sensei_id: string (FK -> SystemPrompt.id, nullable)
  - voice_id: string (FK -> Voice.id, nullable)
  - created_at: timestamp
  - updated_at: timestamp
  - audio_attachment_id: UUID (FK -> Attachment.id, nullable)
  - audio_duration_ms: integer (duration of spoken voice recording, default 0)
  - stt_language: enum(vi, en, ja, auto, default auto)
  - stt_confidence: float (0.0..1.0, STT recognition confidence score)
- name: AgentModel
  aggregate_root: true
  attributes:
  - id: string (PK, e.g. gemini-3.8-flash, claude-3-7-sonnet)
  - name: string (Display Name)
  - provider: enum(GOOGLE, ANTHROPIC, OPENAI, GROQ, OLLAMA)
  - status: enum(ACTIVE, INACTIVE, DEGRADED, ARCHIVED)
  - is_default: boolean
  - context_window: integer
  - max_tokens: integer
  - supports_streaming: boolean
  - latency_ms: integer (nullable)
  - last_checked_at: timestamp (nullable)
  - created_at: timestamp
  - updated_at: timestamp
- name: ApiMetricLog
  aggregate_root: false
  attributes:
  - id: UUID (PK)
  - user_id: UUID (FK -> User.id, nullable for guest)
  - endpoint: string (e.g. /api/v1/chat/stream)
  - http_method: string (GET, POST, PATCH)
  - status_code: integer
  - latency_ms: float
  - ttft_ms: float (nullable)
  - prompt_tokens: integer
  - completion_tokens: integer
  - total_tokens: integer
  - model_used: string (FK -> AgentModel.id, nullable)
  - ip_address: string (hashed/redacted)
  - created_at: timestamp
- name: UserQuota
  aggregate_root: true
  attributes:
  - id: UUID (PK)
  - user_id: UUID (FK -> User.id, UNIQUE)
  - daily_token_limit: integer (default 100000)
  - daily_tokens_used: integer (default 0)
  - rpm_limit: integer (default 30)
  - status: enum(NORMAL, WARNING_80, EXCEEDED_THROTTLED)
  - reset_at: timestamp
  - created_at: timestamp
  - updated_at: timestamp
- name: SystemPrompt
  aggregate_root: true
  attributes:
  - id: string (PK, sp_hex / sensei_id)
  - user_id: UUID / string (FK -> User.id)
  - name: string (1..100, Sensei persona name)
  - description: string (max 500, nullable)
  - content: string (TEXT, 1..10000, persona instructions)
  - age: integer (Sensei age, default 25)
  - gender: string (female / male / other)
  - japanese_level: enum(N5, N4, N3, N2, N1, ALL)
  - personality: string (pedagogical persona attributes)
  - teaching_style: string (teaching methodology & furigana usage)
  - catchphrase: string (signature quote / greeting)
  - hobbies: string (interests & conversational topics)
  - avatar_url: string (portrait / avatar URL)
  - voice_id: string (FK -> Voice.id, nullable)
  - is_default: boolean (default false)
  - is_system_preset: boolean (default false, official pre-seeded senseis N5-N1)
  - created_at: timestamp
  - updated_at: timestamp
- name: Rule
  aggregate_root: true
  attributes:
  - id: string (PK, rule_hex)
  - user_id: UUID / string (FK -> User.id)
  - name: string (1..100)
  - description: string (max 500, nullable)
  - content: string (TEXT)
  - activation_mode: enum(always_on, model_decision, glob, manual)
  - priority: integer (0..100, default 50)
  - status: enum(active, draft, archived)
  - scope: enum(system, user)
  - created_at: timestamp
  - updated_at: timestamp
- name: Attachment
  aggregate_root: true
  attributes:
  - id: string (PK, att_hex)
  - user_id: UUID / string (FK -> User.id)
  - conversation_id: UUID (FK -> Conversation.id, nullable)
  - prompt_id: string (FK -> SystemPrompt.id, nullable)
  - filename: string
  - file_size: integer
  - mime_type: string
  - category: enum(text, image, audio, document)
  - storage_path: string
  - checksum_sha256: string
  - status: enum(STAGED, ATTACHED, ARCHIVED, DELETED)
  - created_at: timestamp
  - updated_at: timestamp
- name: SemanticCache
  aggregate_root: true
  attributes:
  - id: UUID (PK)
  - prompt_raw: string
  - prompt_normalized: string (UNIQUE, indexed)
  - category: string (indexed)
  - response_text: string (TEXT)
  - keywords: string (comma-separated, nullable)
  - similarity_score: float (default 1.0)
  - hit_count: integer (default 1)
  - is_auto_learned: boolean (default false)
  - fts_indexed: boolean (default true)
  - created_at: timestamp
  - updated_at: timestamp
- name: EmbeddedModel
  aggregate_root: true
  attributes:
  - id: string (PK, e.g. qwen2.5-0.5b-embedded)
  - name: string
  - file_path: string
  - file_size_bytes: integer
  - min_ram_gb: float (default 4.0)
  - min_avail_ram_gb: float (default 1.5)
  - min_disk_gb: float (default 1.5)
  - min_cpu_cores: integer (default 2)
  - download_status: enum(NOT_DOWNLOADED, DOWNLOADING, READY, ERROR)
  - download_progress: integer (0..100)
  - is_eligible: boolean
  - created_at: timestamp
  - updated_at: timestamp
- name: Voice
  aggregate_root: true
  attributes:
  - id: string (PK, voice_id e.g. voice_kasukabe_tsumugi)
  - name: string (Display Name e.g. Kasukabe Tsumugi (Normal))
  - character_name: string (Character Name e.g. 春日部つむぎ)
  - speaker_id: integer (VoiceVox speaker ID)
  - style_name: string (e.g. Normal, Joy, Angry)
  - gender: enum(female, male, other)
  - description: string (nullable)
  - speed_scale: float (0.5..2.0, default 1.0)
  - pitch_scale: float (-0.15..0.15, default 0.0)
  - intonation_scale: float (0.0..2.0, default 1.0)
  - volume_scale: float (0.0..2.0, default 1.0)
  - sample_text: string (Japanese sample speech text)
  - avatar_url: string (Character portrait URL)
  - status: enum(ACTIVE, INACTIVE)
  - is_system_preset: boolean (default false)
  - user_id: string (FK -> User.id or 'system')
  - created_at: timestamp
  - updated_at: timestamp
- name: Exam
  aggregate_root: true
  attributes:
  - 'id: string (PK, UUID)'
  - 'title: string (NOT NULL)'
  - 'description: text (nullable)'
  - 'level: enum(N5, N4, N3, N2, N1, KAIWA, GENERAL)'
  - 'category: string (default ''JLPT_FULL'')'
  - 'year: integer (nullable)'
  - 'duration_minutes: integer (default 60)'
  - 'total_questions: integer (default 0)'
  - 'passing_score: integer (default 90)'
  - 'max_score: integer (default 180)'
  - 'drive_folder_url: string (nullable, HTTPS Google Drive URL)'
  - 'status: enum(ACTIVE, DRAFT, ARCHIVED)'
  - 'is_system_preset: boolean (default 1)'
  - 'user_id: string (FK -> User.id or ''system'')'
  - 'created_at: timestamp'
  - 'updated_at: timestamp'
- name: ExamQuestion
  aggregate_root: false
  attributes:
  - 'id: string (PK, UUID)'
  - 'exam_id: string (FK -> Exam.id ON DELETE CASCADE)'
  - 'section: enum(GOI, BUNPOU, DOKKAI, CHOUKAI)'
  - 'question_number: integer'
  - 'question_text: text (Japanese question content)'
  - 'furigana_text: text (nullable, interlinear annotation)'
  - 'option_1: text'
  - 'option_2: text'
  - 'option_3: text'
  - 'option_4: text'
  - 'correct_option: integer (1..4)'
  - 'explanation: text (Vietnamese pedagogical explanation)'
  - 'created_at: timestamp'
- name: ReferenceMaterial
  aggregate_root: true
  attributes:
  - 'id: string (PK, UUID)'
  - 'title: string (NOT NULL)'
  - 'description: text (nullable)'
  - 'category: enum(JLPT_N5, JLPT_N4, JLPT_N3, JLPT_N2, JLPT_N1, KAIWA, GRAMMAR_GUIDE,
    VOCABULARY_DICT)'
  - 'level: string (default ''ALL'')'
  - 'source_type: enum(GOOGLE_DRIVE, WEB_GUIDE, ONLINE_DICT)'
  - 'external_url: string (HTTPS URL)'
  - 'author: string (nullable)'
  - 'file_type: string (folder, website, document)'
  - 'tags: string (nullable)'
  - 'is_pinned: boolean (default 0)'
  - 'is_system_preset: boolean (default 1)'
  - 'user_id: string (FK -> User.id or ''system'')'
  - 'created_at: timestamp'
  - 'updated_at: timestamp'
- name: VoiceInputSession
  aggregate_root: false
  attributes:
  - session_id: string (client ephemeral ID)
  - audio_mime_type: string (e.g. audio/webm, audio/wav)
  - duration_seconds: float (0.0..120.0)
  - language_hint: enum(vi, en, ja, auto)
  - sample_rate_hz: integer (16000..48000)
  - audio_bytes_size: integer (max 10485760)
- name: STTTranscriptResult
  aggregate_root: false
  attributes:
  - transcript_text: string (converted text from voice)
  - detected_language: enum(vi, en, ja)
  - confidence: float (0.0..1.0)
  - latency_ms: float
  - engine_used: enum(whisper_api, faster_whisper, gemini_multimodal, web_speech_api)
relationships:
- from: Voice
  to: Message
  type: one-to-many
- from: SystemPrompt
  to: Message
  type: one-to-many
- from: Voice
  to: SystemPrompt
  type: one-to-many
- from: User
  to: Voice
  type: one-to-many
- from: EmbeddedModel
  to: AgentModel
  type: one-to-one
- from: User
  to: Conversation
  type: one-to-many
- from: Conversation
  to: Message
  type: one-to-many
- from: AgentModel
  to: Message
  type: one-to-many
- from: User
  to: ApiMetricLog
  type: one-to-many
- from: User
  to: UserQuota
  type: one-to-one
- from: AgentModel
  to: ApiMetricLog
  type: one-to-many
- from: User
  to: SystemPrompt
  type: one-to-many
- from: User
  to: Rule
  type: one-to-many
- from: User
  to: Attachment
  type: one-to-many
- from: Conversation
  to: Attachment
  type: one-to-many
- from: SystemPrompt
  to: Attachment
  type: one-to-many
- from: Exam
  to: ExamQuestion
  type: one-to-many
- from: User
  to: Exam
  type: one-to-many
- from: User
  to: ReferenceMaterial
  type: one-to-many
