version: "1.0"
metadata:
  project: "chatjpt"
  domain: "Website Chatbot Assistant"
  layer: "canonical_process_model"
  status: "BASELINED"
  updated_at: "2026-10-07"

processes:
  - id: "PROC-001"
    code: "BP-AUTH-001"
    name: "User Registration"
    type: "Supporting"
    trigger: "Guest submits registration form"
    outcome: "New user account created in database with bcrypt hashed password"
    actors:
      - "ACT-01: Guest"
    source_refs:
      - "FR-001"
      - "SEC-002"
      - "BR-001"
      - "BR-006"
      - "AC-001"
    nodes:
      - "Receive registration form data"
      - "Validate input fields (email format, password min length 6)"
      - "Query existing user by email in PostgreSQL"
      - "Hash password using bcrypt"
      - "Insert new active user record"
      - "Return HTTP 201 Created and redirect to login"
    gateways:
      - id: "D-AUTH-01"
        condition: "Email already exists?"
        on_true: "Return HTTP 400 Bad Request"
        on_false: "Proceed to hash and insert"
    events:
      - "UserRegisteredEvent"
    exceptions:
      - id: "EXC-SEC-03"
        condition: "Rate limit exceeded"
        action: "Return HTTP 429 Too Many Requests"

  - id: "PROC-002"
    code: "BP-AUTH-002"
    name: "User Login & Session Establishment"
    type: "Supporting"
    trigger: "Guest submits login credentials"
    outcome: "JWT session token established in HttpOnly Secure Cookie"
    actors:
      - "ACT-01: Guest"
      - "ACT-02: Registered User"
    source_refs:
      - "FR-002"
      - "SEC-004"
      - "BR-001"
      - "BR-006"
      - "AC-002"
    nodes:
      - "Receive login credentials (email, password)"
      - "Retrieve user record by email"
      - "Verify password against stored bcrypt hash"
      - "Verify account status is ACTIVE"
      - "Generate JWT token valid for 7 days"
      - "Pack token into HttpOnly, Secure, SameSite=Lax Cookie"
      - "Return HTTP 200 OK with user profile"
    gateways:
      - id: "D-AUTH-03"
        condition: "Credentials match?"
        on_true: "Proceed to check status"
        on_false: "Return HTTP 401 Unauthorized"
      - id: "D-AUTH-04"
        condition: "Account active?"
        on_true: "Issue JWT token and session"
        on_false: "Return HTTP 403 Forbidden"
    events:
      - "UserLoggedInEvent"
    exceptions:
      - id: "EXC-SEC-02"
        condition: "Invalid or expired token"
        action: "Clear cookie and redirect to login"

  - id: "PROC-003"
    code: "BP-AUTH-003"
    name: "User Logout & Session Revocation"
    type: "Supporting"
    trigger: "User clicks logout button"
    outcome: "Session Cookie cleared and client state reset"
    actors:
      - "ACT-02: Registered User"
    source_refs:
      - "FR-003"
      - "SEC-004"
      - "BR-001"
      - "AC-002"
    nodes:
      - "Receive logout request with current cookie"
      - "Emit Set-Cookie header with Max-Age=0"
      - "Clear client application memory state"
      - "Redirect browser to /login"
    gateways: []
    events:
      - "UserLoggedOutEvent"
    exceptions: []

  - id: "PROC-004"
    code: "BP-CONV-001"
    name: "Create New Conversation"
    type: "Core"
    trigger: "User clicks New Chat button"
    outcome: "New conversation record created in PostgreSQL linked to user_id"
    actors:
      - "ACT-02: Registered User"
    source_refs:
      - "FR-004"
      - "BR-001"
      - "BR-002"
      - "BR-004"
      - "AC-003"
    nodes:
      - "Authenticate user via JWT Cookie"
      - "Insert conversation record with default title 'Cuộc trò chuyện mới'"
      - "Return HTTP 201 Created with conversation entity"
      - "Prepend conversation to sidebar list"
    gateways:
      - id: "D-CONV-01"
        condition: "Session valid?"
        on_true: "Create conversation"
        on_false: "Return HTTP 401 Unauthorized"
    events:
      - "ConversationCreatedEvent"
    exceptions: []

  - id: "PROC-005"
    code: "BP-CONV-002"
    name: "Retrieve Conversations & History"
    type: "Supporting"
    trigger: "User loads /chat or selects a conversation"
    outcome: "User's conversations and ordered messages rendered on UI"
    actors:
      - "ACT-02: Registered User"
    source_refs:
      - "FR-005"
      - "FR-012"
      - "BR-001"
      - "BR-002"
      - "NFR-018"
      - "AC-003"
    nodes:
      - "Query conversations filtered by user_id ORDER BY updated_at DESC"
      - "When conversation selected: query messages filtered by conv_id"
      - "Render conversation list and messages timeline"
    gateways:
      - id: "D-CONV-02"
        condition: "Conversation owned by current user?"
        on_true: "Return messages list"
        on_false: "Return HTTP 404 / 403 (Anti-IDOR)"
    events:
      - "ConversationLoadedEvent"
    exceptions:
      - id: "EXC-SEC-01"
        condition: "IDOR unauthorized access attempt"
        action: "Block query, log security alert, return 404"

  - id: "PROC-006"
    code: "BP-CONV-003"
    name: "Rename Conversation"
    type: "Supporting"
    trigger: "Automatic title derivation after first message OR manual rename by user"
    outcome: "Conversation title updated in database and sidebar"
    actors:
      - "ACT-02: Registered User"
      - "System LLM Manager"
    source_refs:
      - "FR-006"
      - "BR-002"
      - "BR-004"
      - "AC-003"
    nodes:
      - "Check title condition"
      - "Extract first 30 characters (auto) or accept new title (manual)"
      - "Verify user ownership"
      - "Update conversation title in PostgreSQL"
      - "Synchronize UI sidebar title"
    gateways:
      - id: "D-CONV-03"
        condition: "Current title is default 'Cuộc trò chuyện mới'?"
        on_true: "Execute auto derivation from prompt"
        on_false: "Preserve custom title"
    events:
      - "ConversationRenamedEvent"
    exceptions: []

  - id: "PROC-007"
    code: "BP-CONV-004"
    name: "Delete Conversation"
    type: "Supporting"
    trigger: "User confirms deletion of a conversation"
    outcome: "Conversation and related messages removed from database"
    actors:
      - "ACT-02: Registered User"
    source_refs:
      - "FR-007"
      - "BR-001"
      - "BR-002"
      - "NFR-018"
      - "AC-003"
    nodes:
      - "Receive delete request with conv_id"
      - "Verify user ownership (Anti-IDOR)"
      - "Delete conversation and cascade messages"
      - "Remove item from sidebar and reset chat area"
    gateways:
      - id: "D-CONV-04"
        condition: "User confirms dialog?"
        on_true: "Execute delete"
        on_false: "Dismiss dialog"
    events:
      - "ConversationDeletedEvent"
    exceptions:
      - id: "EXC-SEC-01"
        condition: "Cross-tenant deletion attempt"
        action: "Return HTTP 403 / 404 and record audit log"

  - id: "PROC-008"
    code: "BP-CHAT-001"
    name: "Send Message & Chat Interaction"
    type: "Core"
    trigger: "User submits message in chat input"
    outcome: "Message persisted, SSE stream received, Markdown rendered, bot response persisted"
    actors:
      - "ACT-02: Registered User"
    source_refs:
      - "FR-008"
      - "FR-009"
      - "FR-012"
      - "FR-013"
      - "BR-001"
      - "BR-002"
      - "BR-003"
      - "BR-004"
      - "AC-004"
    nodes:
      - "Client validates message length <= 4000 chars"
      - "Render optimistic user message"
      - "Open POST SSE connection to /api/v1/chat/conversations/{id}/stream"
      - "Verify rate limit, auth, ownership, and length"
      - "Persist user message (role=user)"
      - "Check and execute automatic rename if first prompt"
      - "Load sliding context (last 20 messages)"
      - "Delegate to PROC-009 LLM Orchestrator"
      - "Stream SSE chunks to client"
      - "Persist assistant message (role=assistant)"
      - "Render formatted Markdown and syntax highlighted code"
    gateways:
      - id: "D-CHAT-01"
        condition: "Message valid per BR-003 (1..4000 chars)?"
        on_true: "Proceed with stream"
        on_false: "Reject with HTTP 422"
      - id: "D-CHAT-02"
        condition: "Client stopped generation?"
        on_true: "Abort stream and persist partial content"
        on_false: "Continue stream to completion"
    events:
      - "MessageSentEvent"
      - "ResponseStreamedEvent"
    exceptions:
      - id: "EXC-NET-01"
        condition: "Client disconnect"
        action: "Close generator, save partial response"

  - id: "PROC-009"
    code: "BP-AI-001"
    name: "LLM Orchestration & Failover"
    type: "External_Integration"
    trigger: "Invoked by PROC-008 when prompt ready"
    outcome: "Continuous token stream delivered to client, switching to fallback on error"
    actors:
      - "System LLM Manager"
    source_refs:
      - "FR-010"
      - "FR-011"
      - "FR-014"
      - "BR-005"
      - "NFR-008"
      - "AC-004"
    nodes:
      - "Assemble prompt and conversation history"
      - "Send stream request to Google Gemini API (Primary)"
      - "Listen for response with 30s timeout"
      - "If error (429/5xx/timeout): catch exception and activate OpenAI API"
      - "Yield token stream back to PROC-008"
    gateways:
      - id: "D-AI-01"
        condition: "Gemini responds successfully within 30s?"
        on_true: "Stream from Gemini"
        on_false: "Activate OpenAI Fallback (BR-005)"
    events:
      - "LLMInferenceStartedEvent"
      - "LLMFailoverTriggeredEvent"
      - "LLMInferenceCompletedEvent"
    exceptions:
      - id: "EXC-AI-01"
        condition: "Gemini timeout > 30s"
        action: "Failover to OpenAI"
      - id: "EXC-AI-02"
        condition: "Gemini 429 quota exhaustion"
        action: "Failover to OpenAI"
      - id: "EXC-AI-03"
        condition: "Both Gemini and OpenAI failed"
        action: "Emit structured SSE error event to UI"

  - id: "PROC-010"
    code: "BP-SEC-001"
    name: "Dual-Tier Rate Limiting Defense"
    type: "Security_Control"
    trigger: "Any inbound HTTP request to system"
    outcome: "Requests within quota allowed; abusive requests throttled with HTTP 429"
    actors:
      - "Ingress Nginx Gateway"
      - "FastAPI Middleware"
    source_refs:
      - "NFR-007"
      - "SEC-005"
      - "BR-006"
      - "AC-005"
    nodes:
      - "Evaluate Layer 1 Ingress rate limit (10 req/s per IP)"
      - "Proxy allowed requests to Backend"
      - "Evaluate Layer 2 Application sliding window (60 req/min per IP)"
      - "Pass allowed requests to controller"
    gateways:
      - id: "D-SEC-01"
        condition: "Ingress limit exceeded (> 10 r/s)?"
        on_true: "Nginx returns HTTP 429"
        on_false: "Forward to Backend"
      - id: "D-SEC-02"
        condition: "Backend limit exceeded (> 60 r/min)?"
        on_true: "FastAPI returns HTTP 429 + Retry-After"
        on_false: "Execute endpoint handler"
    events:
      - "RateLimitCheckedEvent"
      - "RateLimitExceededEvent"
    exceptions:
      - id: "EXC-SEC-03"
        condition: "Throttled request"
        action: "Return HTTP 429 and block backend execution"

  - id: "PROC-015"
    code: "BP-RES-001"
    name: "Automated API & LLM Telemetry Collection"
    type: "Supporting"
    trigger: "Any HTTP or SSE request arrives at backend gateway"
    outcome: "Latency, TTFT, token usage, status code captured and logged atomically"
    actors:
      - "ACT-02: Registered User"
      - "FastAPI Telemetry Middleware"
      - "LLM Engine Streaming Handler"
    source_refs:
      - "FR-029"
      - "FR-030"
      - "FR-031"
      - "BR-019"
      - "SEC-009"
    nodes:
      - "Record request arrival timestamp and client identifier"
      - "Verify user quota limits before dispatching to LLM engine (BR-020)"
      - "Intercept streaming token chunks and measure Time-to-First-Token (TTFT)"
      - "Accumulate prompt tokens and completion tokens across stream completion"
      - "Calculate total request duration in milliseconds"
      - "Persist metric record to ApiMetricLog and update UserQuota atomically (BR-019)"
      - "Publish metric event to in-memory Telemetry Ring Buffer"
    gateways:
      - id: "D-RES-01"
        condition: "Is user quota exceeded?"
        on_true: "Reject immediately with HTTP 429 Too Many Requests"
        on_false: "Proceed to process request"
    events:
      - "RequestTelemetryCapturedEvent"
      - "TokenQuotaIncrementedEvent"
    exceptions:
      - id: "EXC-RES-01"
        condition: "Quota daily limit exceeded"
        action: "Return HTTP 429 and emit QuotaExceededAlert"

  - id: "PROC-016"
    code: "BP-RES-002"
    name: "Real-Time Telemetry Streaming & Dashboard Visualization"
    type: "Supporting"
    trigger: "User opens Resource Dashboard at /dashboard"
    outcome: "Client receives live SSE stream and renders interactive real-time resource graphs"
    actors:
      - "ACT-02: Registered User"
      - "Next.js Dashboard Client"
      - "Backend SSE Event Broadcaster"
    source_refs:
      - "FR-032"
      - "FR-033"
      - "FR-034"
      - "BR-020"
      - "BR-021"
      - "SEC-009"
    nodes:
      - "Authenticate user session via JWT HttpOnly cookie"
      - "Establish persistent Server-Sent Events (SSE) connection to /api/v1/resources/stream"
      - "Send initial historical summary snapshot (last 24h metrics, quota gauges)"
      - "Subscribe client to live Telemetry Ring Buffer bus"
      - "Broadcast 1-second metric tick events (active RPM, live TTFT, token velocity)"
      - "Update client sparklines, token gauges, and request log table in real time"
    gateways:
      - id: "D-RES-02"
        condition: "Is user admin or regular user?"
        on_true: "Admin: Broadcast system-wide aggregated metrics (BR-021)"
        on_false: "User: Filter stream to personal usage metrics only (BR-021)"
    events:
      - "DashboardStreamConnectedEvent"
      - "RealTimeMetricTickDispatchedEvent"
    exceptions:
      - id: "EXC-RES-02"
        condition: "Client disconnects or network drops"
        action: "Clean up SSE subscriber from ring buffer gracefully"

  - id: "PROC-017"
    code: "BP-MOD-001"
    name: "Model Catalog Registration & Mutation Lifecycle"
    type: "Supporting"
    trigger: "Administrator or authorized user submits new model or updates model parameters"
    outcome: "Agent model registered or updated in catalog with validation guards enforced"
    actors:
      - "ACT-02: Registered User / Admin"
      - "FastAPI Model Management Controller"
      - "Agent Model Repository"
    source_refs:
      - "FR-035"
      - "FR-036"
      - "BR-022"
      - "BR-023"
      - "BR-024"
      - "SEC-010"
      - "ADR-009"
    nodes:
      - "Receive model payload (id, name, provider, context_window, max_tokens, streaming)"
      - "Validate parameter boundaries (context_window >= 1000, max_tokens >= 256 per BR-024)"
      - "Check ID global uniqueness and provider validity on registration (BR-022)"
      - "On update: verify target exists and ensure ID and provider remain immutable (BR-022)"
      - "Check is_default invariants if default flag is toggled"
      - "Persist model changes to database"
      - "Emit ModelCatalogMutatedEvent"
    gateways:
      - id: "D-MOD-01"
        condition: "Does model ID already exist on registration?"
        on_true: "Reject with HTTP 409 Conflict"
        on_false: "Proceed to insert model"
      - id: "D-MOD-02"
        condition: "Are parameters within safe bounds (BR-024)?"
        on_true: "Accept and persist model"
        on_false: "Reject with HTTP 422 Unprocessable Entity"
    events:
      - "ModelRegisteredEvent"
      - "ModelUpdatedEvent"
    exceptions:
      - id: "EXC-MOD-01"
        condition: "Attempt to mutate immutable model ID or provider"
        action: "Reject with HTTP 400 Bad Request (BR-022)"

  - id: "PROC-018"
    code: "BP-MOD-002"
    name: "Model Multi-Criteria Search, Filtering & Soft Archival"
    type: "Supporting"
    trigger: "User searches/filters model catalog OR requests model deletion/archival"
    outcome: "Filtered and ranked model list returned OR target model safely archived"
    actors:
      - "ACT-02: Registered User / Admin"
      - "Next.js Model Catalog UI"
      - "FastAPI Model Management Controller"
    source_refs:
      - "FR-037"
      - "FR-038"
      - "FR-039"
      - "BR-023"
      - "NFR-022"
      - "ADR-009"
    nodes:
      - "Parse query parameters: q (search), provider, status, has_api_key, is_default, sort"
      - "Execute full-text and fuzzy token matching against model name and id"
      - "Apply multi-attribute boolean and enum filters"
      - "Apply sorting (latency, context_window, name, created_at)"
      - "Return matching model array with execution latency <= 200ms (NFR-022)"
      - "For delete request: check if model is default active model (BR-023)"
      - "Execute soft-delete by transitioning status to ARCHIVED (FR-039)"
    gateways:
      - id: "D-MOD-03"
        condition: "Is target model currently set as is_default = 1?"
        on_true: "Reject delete/archive with HTTP 400 Bad Request (BR-023)"
        on_false: "Set status to ARCHIVED and save"
    events:
      - "ModelsQueriedEvent"
      - "ModelArchivedEvent"
    exceptions:
      - id: "EXC-MOD-02"
        condition: "Target model for archival not found"
        action: "Return HTTP 404 Not Found"

