version: "1.0"
state_machine:
  id: "STATE-VOICE-01"
  entity: "Voice"
  initial_state: "ACTIVE"
  terminal_states:
    - "ARCHIVED"
  states:
    - name: "ACTIVE"
      description: "Voice profile is operational, verified in catalog, and eligible for assignment to Sensei personas."
    - name: "TUNING"
      description: "Voice acoustic parameters (speed, pitch, intonation, volume) are being adjusted and previewed."
    - name: "INACTIVE"
      description: "Voice profile temporarily deactivated or disabled by user or admin; hidden from new Sensei selection."
    - name: "DEGRADED"
      description: "VoiceVox local engine is offline or unreachable; synthesis falls back to acoustic generator or Web Speech."
    - name: "ARCHIVED"
      description: "Voice profile soft-deleted; preserved for historical conversation logs but barred from selection."
  transitions:
    - from: "ACTIVE"
      to: "TUNING"
      trigger: "User opens Voice Tuning Modal"
      guard: "Voice profile exists and user has edit permissions"
    - from: "TUNING"
      to: "ACTIVE"
      trigger: "User saves acoustic parameters"
      guard: "Parameters satisfy BR-040 boundary constraints"
    - from: "TUNING"
      to: "ACTIVE"
      trigger: "User cancels tuning"
    - from: "ACTIVE"
      to: "INACTIVE"
      trigger: "User toggles status to INACTIVE"
    - from: "INACTIVE"
      to: "ACTIVE"
      trigger: "User toggles status to ACTIVE"
    - from: "ACTIVE"
      to: "DEGRADED"
      trigger: "Engine healthcheck fails or connection times out"
    - from: "DEGRADED"
      to: "ACTIVE"
      trigger: "Engine healthcheck recovers (GET /version returns 200)"
    - from: "INACTIVE"
      to: "ARCHIVED"
      trigger: "User deletes custom voice profile"
      guard: "Voice is not an immutable system preset (is_system_preset == false)"

