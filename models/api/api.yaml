version: "1.0"
metadata:
  project: "chatjpt"
  domain: "Japanese Learning Ecosystem with AI Tutor"
  layer: "canonical_api_model"
  status: "BASELINED"
  updated_at: "2026-11-01"

apis:
  - id: "API-001"
    title: "ChatJPT Japanese Learning Platform Core API"
    base_path: "/api/v1"
    operations:
      - id: "OP-001"
        method: "POST"
        path: "/auth/register"
        summary: "Register new Japanese learner user"
        use_case: "UC-001"
        source_refs: ["FR-001", "SEC-002"]

      - id: "OP-002"
        method: "POST"
        path: "/auth/login"
        summary: "Login learner and establish session cookie"
        use_case: "UC-002"
        source_refs: ["FR-002", "SEC-004"]

      - id: "OP-003"
        method: "POST"
        path: "/auth/logout"
        summary: "Logout learner session"
        use_case: "UC-003"
        source_refs: ["FR-003", "SEC-004"]

      - id: "OP-004"
        method: "POST"
        path: "/conversations"
        summary: "Create Japanese study conversation"
        use_case: "UC-004"
        source_refs: ["FR-004", "BR-001", "BR-004"]

      - id: "OP-005"
        method: "GET"
        path: "/conversations"
        summary: "List user learning conversations"
        use_case: "UC-005"
        source_refs: ["FR-005", "BR-002"]

      - id: "OP-006"
        method: "PATCH"
        path: "/conversations/{conv_id}"
        summary: "Rename conversation title"
        use_case: "UC-006"
        source_refs: ["FR-006", "BR-002", "BR-004"]

      - id: "OP-007"
        method: "DELETE"
        path: "/conversations/{conv_id}"
        summary: "Delete study conversation"
        use_case: "UC-007"
        source_refs: ["FR-007", "BR-002"]

      - id: "OP-008"
        method: "GET"
        path: "/conversations/{conv_id}/messages"
        summary: "Get conversation message history"
        use_case: "UC-005"
        source_refs: ["FR-012", "BR-002"]

      - id: "OP-009"
        method: "POST"
        path: "/conversations/{conv_id}/messages/stream"
        summary: "Stream Kaiwa and grammar explanations via SSE"
        use_case: "UC-008"
        source_refs: ["FR-008", "FR-009", "FR-010", "FR-011", "FR-013", "FR-014", "BR-003", "BR-005"]

      - id: "OP-010"
        method: "GET"
        path: "/models"
        summary: "List all configured agent models"
        use_case: "UC-016"
        source_refs: ["FR-021", "CAP-AGENT-MGMT"]

      - id: "OP-011"
        method: "GET"
        path: "/models/{model_id}"
        summary: "Get agent model details and capabilities"
        use_case: "UC-017"
        source_refs: ["FR-022", "CAP-AGENT-MGMT"]

      - id: "OP-012"
        method: "POST"
        path: "/models/{model_id}/test"
        summary: "Ping and health-check agent model connection"
        use_case: "UC-018"
        source_refs: ["FR-023", "BR-014", "CAP-AGENT-MGMT"]

      - id: "OP-013"
        method: "PATCH"
        path: "/models/{model_id}/activate"
        summary: "Activate agent model for routing"
        use_case: "UC-019"
        source_refs: ["FR-024", "BR-012", "BR-014", "CAP-AGENT-MGMT"]

      - id: "OP-014"
        method: "PATCH"
        path: "/models/{model_id}/deactivate"
        summary: "Deactivate agent model"
        use_case: "UC-019"
        source_refs: ["FR-025", "BR-012", "BR-013", "CAP-AGENT-MGMT"]

      - id: "OP-015"
        method: "PATCH"
        path: "/models/default"
        summary: "Set default active agent model"
        use_case: "UC-020"
        source_refs: ["FR-026", "BR-013", "CAP-AGENT-MGMT"]

      - id: "OP-018"
        method: "GET"
        path: "/resources/summary"
        summary: "Get aggregated resource usage summary (latency, tokens, quota status)"
        use_case: "UC-023"
        source_refs: ["FR-029", "FR-030", "FR-031", "FR-032", "BR-019", "BR-021"]

      - id: "OP-019"
        method: "GET"
        path: "/resources/stream"
        summary: "Stream real-time resource telemetry metrics via SSE"
        use_case: "UC-023"
        source_refs: ["FR-033", "FR-034", "BR-021", "SEC-009"]

      - id: "OP-020"
        method: "GET"
        path: "/resources/quota"
        summary: "Get current user token quota limit and remaining allowance"
        use_case: "UC-025"
        source_refs: ["FR-032", "BR-020", "SEC-009"]

      - id: "OP-021"
        method: "GET"
        path: "/resources/history"
        summary: "Get historical time-series resource metrics"
        use_case: "UC-024"
        source_refs: ["FR-029", "FR-030", "FR-031", "BR-021"]

      - id: "OP-022"
        method: "POST"
        path: "/models"
        summary: "Register new agent model"
        use_case: "UC-026"
        source_refs: ["FR-035", "BR-022", "BR-024", "SEC-010"]

      - id: "OP-023"
        method: "PUT"
        path: "/models/{model_id}"
        summary: "Update existing agent model"
        use_case: "UC-027"
        source_refs: ["FR-036", "BR-022", "BR-024", "SEC-010"]

      - id: "OP-024"
        method: "GET"
        path: "/models/search"
        summary: "Search, filter, and sort agent models"
        use_case: "UC-028"
        source_refs: ["FR-037", "FR-038", "NFR-022"]

      - id: "OP-025"
        method: "DELETE"
        path: "/models/{model_id}"
        summary: "Soft delete and archive agent model"
        use_case: "UC-027"
        source_refs: ["FR-039", "BR-023", "SEC-010"]

      - id: "OP-037"
        method: "GET"
        path: "/health"
        summary: "Global service and database connectivity health check"
        use_case: "UC-035"
        source_refs: ["NFR-001"]

      - id: "OP-038"
        method: "GET"
        path: "/system-prompts"
        summary: "List Sensei instruction prompts and personas"
        use_case: "UC-036"
        source_refs: ["FR-PROMPT-001"]

      - id: "OP-039"
        method: "GET"
        path: "/rules"
        summary: "List Japanese grammar and pedagogic guardrail rules"
        use_case: "UC-037"
        source_refs: ["FR-RULE-001"]

      - id: "OP-040"
        method: "POST"
        path: "/attachments/upload"
        summary: "Upload learning material and document attachment"
        use_case: "UC-038"
        source_refs: ["FR-ATT-001"]

      - id: "OP-041"
        method: "GET"
        path: "/settings/api-keys"
        summary: "List and manage BYOK provider API keys"
        use_case: "UC-039"
        source_refs: ["SEC-015"]
