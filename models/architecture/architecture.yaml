version: '1.0'
architecture:
  id: ARCH-001
  name: chatjpt-layered-solid-architecture
  view: current
  source_refs:
  - ai-frontend
  - ai-backend/src
  - ai-backend/llm
  - ai-infra
  components:
  - id: COMP-001
    name: ai-frontend
    type: client-application
    responsibilities:
    - User Interface rendering & interaction (Next.js 16 App Router)
    - Client-side fast calculation and parsing
    - Local state cache & streaming chunk rendering
    - Interactive Real-Time Resource Dashboard with Live SSE Charts & Quota Gauges
  - id: COMP-002
    name: ai-backend-src
    type: service-backend
    responsibilities:
    - Thin HTTP/SSE API controllers (src/api/v1/) with zero inline SQL or DTOs
    - Separated Pydantic v2 DTO contracts (src/schemas/v1/) and domain entities (src/models/v1/)
    - Composition Root Dependency Injection (src/dependencies.py) & global DomainError handler
    - Repository Layer & SQLite WAL DatabaseManager / UnitOfWork (src/repositories/, src/core/database.py)
    - Security boundary: bcrypt, JWT with SEC-007 password_changed_at revocation, explicit ADMIN_EMAILS RBAC, AES-GCM SecretVault, SSRF & Path Traversal guards
    - Pure ASGI non-buffering TelemetryMiddleware, SQL-aggregated KPIs, atomic UserQuota, bounded SSE broadcaster
    - ProviderRegistry Strategy/Factory for BYOK credentials and dynamic Agent Model Catalog
  - id: COMP-003
    name: ai-backend-llm
    type: llm-engine
    responsibilities:
    - Modular LLM orchestration (llm/circuit_breaker.py, llm/message_builder.py, llm/orchestrator.py, llm/agent.py facade)
    - Per-user scoped 429 Circuit Breaker isolating BYOK rate limits across tenants
    - 20-message sliding window (INV-04) & multimodal image/document/PDF attachment builder
    - LangGraph stateful workflow & multi-provider failover chain (Groq, Gemini, OpenAI, Anthropic, Ollama, Embedded, Offline Semantic Cache)
    - PedagogicalPromptBuilder injecting trilingual Sensei personas and active always_on rules
  - id: COMP-004
    name: ai-infra
    type: infrastructure-operations
    responsibilities:
    - Multi-container orchestration (Docker Compose, Dockerfiles)
    - Reverse proxy, rate limiting, and SSL termination (Nginx)
    - Observability and automated environment bootstrapping
  - id: COMP-005
    name: voicevox-tts-service
    type: neural-tts-service
    responsibilities:
    - Chain-of-Responsibility TTS synthesis (Embedded VoiceVox Core ONNX -> Local Daemon HTTP :50021 -> Acoustic PCM WAV fallback)
    - Acoustic parameter tuning and bounds clamping (speed, pitch, intonation, volume - BR-040)
    - Thread-safe LRU WAV caching excluding fallback chime audio (BR-042)
    - Voice catalog CRUD delegated to VoiceRepository with owner and system-preset guards
  - id: COMP-006
    name: exam-and-reference-service
    type: core-pedagogy-service
    responsibilities:
    - Single-query ExamRepository (eliminating N+1 question count queries) & level/category filtering (N5..N1, Kaiwa)
    - Interactive test submission, strict option validation, auto-scoring, and Sensei explanations
    - Anti-cheat answer-key protection (CTRL-EXAM-03) and system-preset immutability (BR-044)
    - Safe local PDF serving (mtime-cached manifest + PROJECT_ROOT containment) and pedagogical RAG search
  - id: COMP-007
    name: stt-transcription-service
    type: speech-recognition-service
    responsibilities:
    - Strategy + Chain-of-Responsibility multilingual STT (Groq Whisper -> OpenAI Whisper -> Gemini Multimodal Audio -> Heuristic Fallback)
    - Non-blocking thread offloading for synchronous SDK calls & dynamic audio MIME detection
    - Bounded chunked upload cap (10MB, SEC-021), magic-byte validation, and disk rollback on DB failure
  boundaries:
  - name: client-boundary
    scope: Browser to Reverse Proxy / API Gateway
  - name: llm-isolation-boundary
    scope: Backend business logic to external LLM provider APIs
  dependencies:
  - from: ai-frontend
    to: ai-backend-src
    protocol: HTTP/REST, SSE, WebSocket
  - from: ai-backend-src
    to: ai-backend-llm
    protocol: In-process Python module invocation
  - from: ai-backend-llm
    to: external-llm-providers
    protocol: HTTPS / REST API
  - from: ai-infra
    to: ai-frontend
    protocol: Docker / Nginx routing
  - from: ai-infra
    to: ai-backend-src
    protocol: Docker / Network bridge
  - from: ai-backend-src
    to: voicevox-tts-service
    protocol: HTTP / REST (port 50021)
  constraints:
  - Zero credentials committed to source control
  - Decoupled LLM integration module from core backend business logic
  quality_attributes:
  - Low latency client response via streaming & client compute
  - Resilience via automatic LLM provider fallback
  decisions:
  - id: ADR-001
    title: Decouple LLM Engine into ai-backend/llm and Core Web in ai-backend/src
    status: approved
  - id: ADR-002
    title: 'Three-tier root layout: ai-frontend, ai-backend, ai-infra'
    status: approved
  - id: ADR-005
    title: LangChain and LangGraph Stateful Multi-Provider Agent Architecture Loaded
      via .env
    status: approved
  - id: ADR-006
    title: Multi-Provider Agent Model Lifecycle and Management Architecture without
      Hard Deletion
    status: approved
  - id: ADR-007
    title: Discord OAuth2 Authorization Code Flow Authentication with CSRF State Guard
    status: approved
  - id: ADR-008
    title: Real-Time Resource Telemetry Interception, SSE Live Broadcasting & Quota
      Guard Architecture
    status: approved
  - id: ADR-009
    title: Extensible Agent Model Management, Mutation Validation, Fuzzy Search &
      Multi-Attribute Filtering Architecture
    status: approved
  - id: ADR-010
    title: Bi-directional Discord Identity Binding, Conflict Rejection & Safe Account
      Unlinking Architecture
    status: approved
  - id: ADR-012
    title: Discord Bot Multi-Scope Management, Active Model Routing & Unified Quota
      Sharing Architecture
    status: approved
  - id: ADR-013
    title: Intelligent VRM Behavioral Animation, Idle Engine & Variation Selection
      Architecture
    status: approved
  - id: ADR-014
    title: End-to-End Discord Message Processing Through AI-Chan Project Graphs &
      Connected Models
    status: approved
  - id: ADR-015
    title: VoiceVox Neural TTS Character Engine Integration and Sensei Voice Binding
      Architecture
    status: approved
  - id: ADR-016
    title: Exam Bank, Interactive Assessment Runner, and Curated Reference Repository
      Architecture
    status: approved
  - id: ADR-017
    title: Backend 4-Layer SOLID, KISS, and Design Pattern Refactoring (Thin Routers,
      Services, Repositories, UnitOfWork, Composition Root, and Pure ASGI Telemetry)
    status: approved
